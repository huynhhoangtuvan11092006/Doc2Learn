# QLoRA Training Configuration for Doc2Learn
# Designed for Meta-Llama-3-8B-Instruct fine-tuning on consumer/free-tier GPUs (e.g. Nvidia T4 / RTX 3060)

model:
  base_model_name: "unsloth/llama-3-8b-Instruct"
  torch_dtype: "bfloat16"
  trust_remote_code: true

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"               # NormalFloat4: optimal for normally distributed weights
  bnb_4bit_use_double_quant: true          # Quantizes quantization constants (saves extra 0.4 bit/param)
  bnb_4bit_compute_dtype: "bfloat16"

lora:
  r: 16                                    # Rank dimension of low-rank matrices
  lora_alpha: 32                           # Scaling factor (rule of thumb: alpha = 2 * r)
  lora_dropout: 0.05                       # Dropout probability to mitigate overfitting
  target_modules:                          # Apply LoRA to all attention and MLP projection layers
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "models/lora-adapter"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4          # Effective batch size = 4 * 4 = 16
  learning_rate: 0.0002                   # 2e-4: standard learning rate for QLoRA
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  optim: "paged_adamw_8bit"                # Page out memory to CPU RAM if GPU VRAM spikes
  max_seq_length: 512
  logging_steps: 5
  save_strategy: "epoch"
  seed: 42

paths:
  train_data: "data/synthetic/train.jsonl"
  val_data: "data/synthetic/val.jsonl"

